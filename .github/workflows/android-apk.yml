name: Android APK CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_release:
        description: Build signed release APKs (does not publish without a tag)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    name: Test, lint, and build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare non-production SN auth placeholder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          rm -f app/src/main/res/raw/sn_auth_file.*
          printf '%s\n' 'sn_auth_placeholder_for_ci' > app/src/main/res/raw/sn_auth_file.lc

      - name: Run unit tests, lint, and debug builds
        run: ./gradlew --no-daemon test lintDebug assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            phone-app/build/outputs/apk/debug/phone-app-debug.apk
            glasses-app/build/outputs/apk/debug/glasses-app-debug.apk

  release:
    name: Build and publish signed release APKs
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      SN_AUTH_FILE_BASE64: ${{ secrets.SN_AUTH_FILE_BASE64 }}
      ROKID_CLIENT_SECRET: ${{ secrets.ROKID_CLIENT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          extract_version() {
            sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' "$1" | head -n 1
          }

          app_version="$(extract_version app/build.gradle.kts)"
          phone_version="$(extract_version phone-app/build.gradle.kts)"
          glasses_version="$(extract_version glasses-app/build.gradle.kts)"

          if [[ -z "${app_version}" || "${app_version}" != "${phone_version}" || "${app_version}" != "${glasses_version}" ]]; then
            echo "All application modules must use the same non-empty versionName." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            expected_tag="v${app_version}"
            if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match versionName ${app_version}." >&2
              exit 1
            fi
            if ! grep -Fqx "# Rokid AI Assistant ${expected_tag}" RELEASE_NOTES.md; then
              echo "RELEASE_NOTES.md must start a section for ${expected_tag}." >&2
              exit 1
            fi
          fi

          echo "version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            RELEASE_KEYSTORE_BASE64
            RELEASE_STORE_PASSWORD
            RELEASE_KEY_ALIAS
            RELEASE_KEY_PASSWORD
            SN_AUTH_FILE_BASE64
            ROKID_CLIENT_SECRET
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare release credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo "RELEASE_STORE_FILE=${RUNNER_TEMP}/release.jks" >> "${GITHUB_ENV}"
          RELEASE_STORE_FILE="${RUNNER_TEMP}/release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RELEASE_STORE_FILE}"
          mkdir -p app/src/main/res/raw
          rm -f app/src/main/res/raw/sn_auth_file.*
          printf '%s' "${SN_AUTH_FILE_BASE64}" | base64 --decode > app/src/main/res/raw/sn_auth_file.lc

      - name: Build signed release APKs
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Collect and verify release APKs
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/rokid-ai-assistant-v${VERSION}.apk"
          cp phone-app/build/outputs/apk/release/phone-app-release.apk "release-artifacts/rokid-phone-v${VERSION}.apk"
          cp glasses-app/build/outputs/apk/release/glasses-app-release.apk "release-artifacts/rokid-glasses-v${VERSION}.apk"

          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "${apksigner_path}" ]]; then
            echo 'Unable to locate apksigner in the Android SDK.' >&2
            exit 1
          fi
          for apk in release-artifacts/*.apk; do
            "${apksigner_path}" verify --verbose --print-certs "${apk}"
          done
          (cd release-artifacts && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-v${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: release-artifacts/

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "Rokid AI Assistant ${GITHUB_REF_NAME}"
          --notes-file RELEASE_NOTES.md
